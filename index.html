<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .form-section, .preview-section {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .section-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .form-content {
            padding: 25px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .subsection-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #667eea;
            margin: 25px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .subsection-title:first-of-type {
            margin-top: 0;
        }

        .material-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #e9ecef;
        }

        .material-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .material-number {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-add {
            width: 100%;
            margin-top: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .action-buttons .btn {
            flex: 1;
            justify-content: center;
        }

        /* Preview Section */
        .preview-content {
            padding: 25px;
            background: #f5f5f5;
        }

        #invoice-preview {
            background: white;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            min-height: 800px;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 3px solid #667eea;
        }

        .vendor-info h2 {
            color: #667eea;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .vendor-info p {
            color: #666;
            line-height: 1.6;
        }

        .invoice-title-section {
            text-align: right;
        }

        .invoice-title {
            font-size: 2.5rem;
            color: #333;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .invoice-meta {
            margin-top: 15px;
        }

        .invoice-meta-row {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-bottom: 8px;
        }

        .invoice-meta-label {
            font-weight: 600;
            color: #667eea;
        }

        .invoice-meta-value {
            color: #333;
            min-width: 120px;
        }

        .bill-to-section {
            margin-bottom: 40px;
        }

        .bill-to-label {
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .bill-to-company {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .bill-to-address {
            color: #666;
            line-height: 1.6;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .items-table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .items-table th:last-child,
        .items-table td:last-child {
            text-align: right;
        }

        .items-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .items-table tr:hover {
            background: #f8f9fa;
        }

        .totals-section {
            margin-left: auto;
            width: 350px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .total-row:last-child {
            border-bottom: none;
            border-top: 3px solid #667eea;
            margin-top: 10px;
            padding-top: 15px;
        }

        .total-label {
            font-weight: 600;
            color: #666;
        }

        .total-row:last-child .total-label {
            color: #333;
            font-size: 1.2rem;
        }

        .total-value {
            font-weight: 600;
            color: #333;
        }

        .total-row:last-child .total-value {
            font-size: 1.3rem;
            color: #667eea;
        }

        .bank-details-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .bank-details-title {
            font-size: 1rem;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .bank-details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .bank-detail-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .bank-detail-label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .bank-detail-value {
            font-weight: 600;
            color: #333;
        }

        .payment-terms-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .payment-terms-label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .payment-terms-value {
            font-weight: 600;
            color: #333;
        }

        .footer-note {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #888;
            font-size: 0.85rem;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .form-section, .section-header, .action-buttons {
                display: none !important;
            }
            .preview-section {
                box-shadow: none;
            }
            #invoice-preview {
                box-shadow: none;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Invoice Generator</h1>
            <p>Fill in the form below to generate your invoice</p>
        </header>

        <div class="main-content">
            <!-- Form Section -->
            <div class="form-section">
                <div class="section-header">
                    Invoice Details
                </div>
                <div class="form-content">
                    <!-- Vendor Information -->
                    <div class="subsection-title">Vendor Information</div>
                    <div class="form-group">
                        <label>Vendor / Company Name</label>
                        <input type="text" id="vendorName" value="Domestic US Supplier 1 for Model Company">
                    </div>
                    <div class="form-group">
                        <label>Vendor Address</label>
                        <textarea id="vendorAddress" rows="2">12 Street, Kolkata 700091</textarea>
                    </div>
                    <div class="form-group">
                        <label>Tax ID / GST Number</label>
                        <input type="text" id="taxId" value="07ABCDE1234F1Z5">
                    </div>

                    <!-- Invoice Details -->
                    <div class="subsection-title">Invoice Details</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Invoice #</label>
                            <input type="text" id="invoiceNumber" value="INV-2026-001">
                        </div>
                        <div class="form-group">
                            <label>Invoice Date</label>
                            <input type="date" id="invoiceDate" value="2026-03-06">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Reference PO</label>
                            <input type="text" id="refPo" value="4500000297">
                        </div>
                        <div class="form-group">
                            <label>Currency</label>
                            <select id="currency">
                                <option value="INR" selected>INR (Indian Rupee)</option>
                                <option value="USD">USD (US Dollar)</option>
                                <option value="EUR">EUR (Euro)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tax Type</label>
                            <input type="text" id="taxType" value="GST">
                        </div>
                        <div class="form-group">
                            <label>Tax Rate (%)</label>
                            <input type="number" id="taxRate" value="18" min="0" max="100">
                        </div>
                    </div>

                    <!-- Customer Information -->
                    <div class="subsection-title">Customer Information</div>
                    <div class="form-group">
                        <label>Bill To (Company Name)</label>
                        <input type="text" id="billToCompany" value="Nestle Limited">
                    </div>
                    <div class="form-group">
                        <label>Bill To Address</label>
                        <textarea id="billToAddress" rows="3">Plot No. 12, Sector 62, Noida, Gautam Buddh Nagar, Uttar Pradesh - 201309</textarea>
                    </div>

                    <!-- Material Line Items -->
                    <div class="subsection-title">Material Line Items</div>
                    <div id="materialItems">
                        <!-- Material items will be dynamically added here -->
                    </div>
                    <button class="btn btn-primary btn-add" onclick="addMaterialItem()">
                        <span>+</span> Add Item
                    </button>

                    <!-- Bank Details -->
                    <div class="subsection-title">Bank Details</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Bank Name</label>
                            <input type="text" id="bankName" value="Test Bank Ltd.">
                        </div>
                        <div class="form-group">
                            <label>Account Number</label>
                            <input type="text" id="accountNumber" value="9988776655">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>IFSC Code</label>
                        <input type="text" id="ifscCode" value="TBNK0100001">
                    </div>

                    <!-- Payment Terms -->
                    <div class="subsection-title">Payment Terms</div>
                    <div class="form-group">
                        <label>Terms Description</label>
                        <input type="text" id="paymentTerms" value="Payment expected within 30 days from Invoice Date">
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button class="btn btn-success" onclick="downloadPDF()">
                            <span>PDF</span> Download PDF
                        </button>
                        <button class="btn btn-primary" onclick="printInvoice()">
                            <span>Print</span> Print Invoice
                        </button>
                    </div>
                </div>
            </div>

            <!-- Preview Section -->
            <div class="preview-section">
                <div class="section-header">
                    Invoice Preview
                </div>
                <div class="preview-content">
                    <div id="invoice-preview">
                        <!-- Invoice content will be dynamically generated -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Predefined material items
        const defaultMaterials = [
            {
                code: 'CH-1100',
                description: 'Label GranuSAP',
                qty: 10,
                uom: 'EA',
                price: 100
            },
            {
                code: 'CH-1440',
                description: 'Pigment, blue',
                qty: 5,
                uom: 'LB',
                price: 50
            }
        ];

        let materialItems = [];

        // Initialize with default materials
        function initMaterials() {
            materialItems = [...defaultMaterials];
            renderMaterialItems();
        }

        // Render material items in form
        function renderMaterialItems() {
            const container = document.getElementById('materialItems');
            container.innerHTML = '';

            materialItems.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'material-item';
                itemDiv.innerHTML = `
                    <div class="material-header">
                        <span class="material-number">Material #${index + 1}</span>
                        <button class="btn btn-danger" onclick="removeMaterialItem(${index})">Remove</button>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Material Code</label>
                            <input type="text" class="mat-code" data-index="${index}" value="${item.code}">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" class="mat-desc" data-index="${index}" value="${item.description}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Quantity</label>
                            <input type="number" class="mat-qty" data-index="${index}" value="${item.qty}" min="0">
                        </div>
                        <div class="form-group">
                            <label>UOM</label>
                            <select class="mat-uom" data-index="${index}">
                                <option value="EA" ${item.uom === 'EA' ? 'selected' : ''}>EA (Each)</option>
                                <option value="PC" ${item.uom === 'PC' ? 'selected' : ''}>PC (Piece)</option>
                                <option value="LB" ${item.uom === 'LB' ? 'selected' : ''}>LB (Pound)</option>
                                <option value="KG" ${item.uom === 'KG' ? 'selected' : ''}>KG (Kilogram)</option>
                                <option value="BOX" ${item.uom === 'BOX' ? 'selected' : ''}>BOX</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Unit Price</label>
                        <input type="number" class="mat-price" data-index="${index}" value="${item.price}" min="0" step="0.01">
                    </div>
                `;
                container.appendChild(itemDiv);
            });

            // Add event listeners
            document.querySelectorAll('#materialItems input, #materialItems select').forEach(input => {
                input.addEventListener('input', updateMaterialItem);
            });

            updatePreview();
        }

        // Update material item on input change
        function updateMaterialItem(e) {
            const index = parseInt(e.target.dataset.index);
            const field = e.target.className.replace('mat-', '');
            
            if (field === 'code') materialItems[index].code = e.target.value;
            else if (field === 'desc') materialItems[index].description = e.target.value;
            else if (field === 'qty') materialItems[index].qty = parseFloat(e.target.value) || 0;
            else if (field === 'uom') materialItems[index].uom = e.target.value;
            else if (field === 'price') materialItems[index].price = parseFloat(e.target.value) || 0;

            updatePreview();
        }

        // Add new material item
        function addMaterialItem() {
            materialItems.push({
                code: '',
                description: '',
                qty: 1,
                uom: 'EA',
                price: 0
            });
            renderMaterialItems();
        }

        // Remove material item
        function removeMaterialItem(index) {
            materialItems.splice(index, 1);
            renderMaterialItems();
        }

        // Format currency
        function formatCurrency(amount, currency) {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: currency,
                minimumFractionDigits: 2
            }).format(amount);
        }

        // Format currency without symbol for PDF
        function formatCurrencyPlain(amount, currency) {
            const symbol = currency === 'INR' ? 'Rs. ' : currency === 'USD' ? '$ ' : '€ ';
            return symbol + amount.toFixed(2);
        }

        // Update invoice preview
        function updatePreview() {
            const vendorName = document.getElementById('vendorName').value;
            const vendorAddress = document.getElementById('vendorAddress').value;
            const taxId = document.getElementById('taxId').value;
            const invoiceNumber = document.getElementById('invoiceNumber').value;
            const invoiceDate = document.getElementById('invoiceDate').value;
            const refPo = document.getElementById('refPo').value;
            const currency = document.getElementById('currency').value;
            const taxType = document.getElementById('taxType').value;
            const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
            const billToCompany = document.getElementById('billToCompany').value;
            const billToAddress = document.getElementById('billToAddress').value;
            const bankName = document.getElementById('bankName').value;
            const accountNumber = document.getElementById('accountNumber').value;
            const ifscCode = document.getElementById('ifscCode').value;
            const paymentTerms = document.getElementById('paymentTerms').value;

            // Calculate totals
            let subtotal = 0;
            const itemsHtml = materialItems.map(item => {
                const total = item.qty * item.price;
                subtotal += total;
                return `
                    <tr>
                        <td>${item.code}</td>
                        <td>${item.description}</td>
                        <td>${item.qty}</td>
                        <td>${item.uom}</td>
                        <td>${formatCurrency(item.price, currency)}</td>
                        <td>${formatCurrency(total, currency)}</td>
                    </tr>
                `;
            }).join('');

            const taxAmount = subtotal * (taxRate / 100);
            const total = subtotal + taxAmount;

            const previewHtml = `
                <div class="invoice-header">
                    <div class="vendor-info">
                        <h2>${vendorName}</h2>
                        <p>${vendorAddress.replace(/\n/g, '<br>')}</p>
                        <p style="margin-top: 10px;"><strong>Tax ID:</strong> ${taxId}</p>
                    </div>
                    <div class="invoice-title-section">
                        <div class="invoice-title">INVOICE</div>
                        <div class="invoice-meta">
                            <div class="invoice-meta-row">
                                <span class="invoice-meta-label">Invoice #</span>
                                <span class="invoice-meta-value">${invoiceNumber}</span>
                            </div>
                            <div class="invoice-meta-row">
                                <span class="invoice-meta-label">Invoice Date</span>
                                <span class="invoice-meta-value">${invoiceDate}</span>
                            </div>
                            <div class="invoice-meta-row">
                                <span class="invoice-meta-label">Ref. PO</span>
                                <span class="invoice-meta-value">${refPo}</span>
                            </div>
                            <div class="invoice-meta-row">
                                <span class="invoice-meta-label">Currency</span>
                                <span class="invoice-meta-value">${currency}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bill-to-section">
                    <div class="bill-to-label">Bill To:</div>
                    <div class="bill-to-company">${billToCompany}</div>
                    <div class="bill-to-address">${billToAddress.replace(/\n/g, '<br>')}</div>
                </div>

                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Material No.</th>
                            <th>Description</th>
                            <th>Qty</th>
                            <th>Unit</th>
                            <th>Price</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${itemsHtml}
                    </tbody>
                </table>

                <div class="totals-section">
                    <div class="total-row">
                        <span class="total-label">Subtotal</span>
                        <span class="total-value">${formatCurrency(subtotal, currency)}</span>
                    </div>
                    <div class="total-row">
                        <span class="total-label">${taxType} (${taxRate}%)</span>
                        <span class="total-value">${formatCurrency(taxAmount, currency)}</span>
                    </div>
                    <div class="total-row">
                        <span class="total-label">TOTAL</span>
                        <span class="total-value">${formatCurrency(total, currency)}</span>
                    </div>
                </div>

                <div class="bank-details-section">
                    <div class="bank-details-title">Bank Details</div>
                    <div class="bank-details-grid">
                        <div class="bank-detail-item">
                            <div class="bank-detail-label">Bank Name</div>
                            <div class="bank-detail-value">${bankName}</div>
                        </div>
                        <div class="bank-detail-item">
                            <div class="bank-detail-label">Account Number</div>
                            <div class="bank-detail-value">${accountNumber}</div>
                        </div>
                        <div class="bank-detail-item">
                            <div class="bank-detail-label">IFSC Code</div>
                            <div class="bank-detail-value">${ifscCode}</div>
                        </div>
                    </div>
                </div>

                <div class="payment-terms-section">
                    <div class="payment-terms-label">Payment Terms</div>
                    <div class="payment-terms-value">${paymentTerms}</div>
                </div>

                <div class="footer-note">
                    Thank you for your business!
                </div>
            `;

            document.getElementById('invoice-preview').innerHTML = previewHtml;
        }

        // Download PDF with proper text formatting (not image-based)
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const drawWrappedMetaRow = ({ label, value, labelX, valueX, y, valueWidth, lineHeight }) => {
                const wrappedValueLines = doc.splitTextToSize(value || '-', valueWidth);

                doc.setTextColor(102, 126, 234);
                doc.setFont('helvetica', 'bold');
                doc.text(label, labelX, y);

                doc.setTextColor(50, 50, 50);
                doc.setFont('helvetica', 'normal');
                wrappedValueLines.forEach((line, index) => {
                    doc.text(line, valueX, y + (index * lineHeight));
                });

                return wrappedValueLines.length;
            };
            
            const vendorName = document.getElementById('vendorName').value;
            const vendorAddress = document.getElementById('vendorAddress').value;
            const taxId = document.getElementById('taxId').value;
            const invoiceNumber = document.getElementById('invoiceNumber').value;
            const invoiceDate = document.getElementById('invoiceDate').value;
            const refPo = document.getElementById('refPo').value;
            const currency = document.getElementById('currency').value;
            const taxType = document.getElementById('taxType').value;
            const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
            const billToCompany = document.getElementById('billToCompany').value;
            const billToAddress = document.getElementById('billToAddress').value;
            const bankName = document.getElementById('bankName').value;
            const accountNumber = document.getElementById('accountNumber').value;
            const ifscCode = document.getElementById('ifscCode').value;
            const paymentTerms = document.getElementById('paymentTerms').value;

            // Calculate totals
            let subtotal = 0;
            const tableData = materialItems.map(item => {
                const total = item.qty * item.price;
                subtotal += total;
                return [
                    item.code,
                    item.description,
                    item.qty.toString(),
                    item.uom,
                    formatCurrencyPlain(item.price, currency),
                    formatCurrencyPlain(total, currency)
                ];
            });

            const taxAmount = subtotal * (taxRate / 100);
            const total = subtotal + taxAmount;

            // Set document properties
            doc.setProperties({
                title: invoiceNumber,
                subject: 'Invoice',
                author: vendorName,
                keywords: 'invoice, billing',
                creator: 'Invoice Generator'
            });

            // Header - Vendor Info (Left side)
            doc.setFontSize(16);
            doc.setTextColor(102, 126, 234);
            doc.setFont('helvetica', 'bold');
            doc.text(vendorName, 15, 20);
            
            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.setFont('helvetica', 'normal');
            const addressLines = vendorAddress.split('\n');
            addressLines.forEach((line, i) => {
                doc.text(line, 15, 28 + (i * 5));
            });
            doc.text(`Tax ID: ${taxId}`, 15, 28 + (addressLines.length * 5) + 3);

            // Header - Invoice Title (Right side)
            doc.setFontSize(24);
            doc.setTextColor(50, 50, 50);
            doc.setFont('helvetica', 'bold');
            doc.text('INVOICE', 195, 20, { align: 'right' });

            // Invoice Meta (Right side) - wraps long values to avoid overlap
            doc.setFontSize(10);
            const metaRows = [
                { label: 'Invoice #', value: invoiceNumber },
                { label: 'Invoice Date', value: invoiceDate },
                { label: 'Ref. PO', value: refPo },
                { label: 'Currency', value: currency }
            ];

            let metaY = 32;
            const metaLineHeight = 5;
            metaRows.forEach((row) => {
                const usedLines = drawWrappedMetaRow({
                    label: row.label,
                    value: row.value,
                    labelX: 130,
                    valueX: 160,
                    y: metaY,
                    valueWidth: 35,
                    lineHeight: metaLineHeight
                });

                metaY += Math.max(usedLines, 1) * metaLineHeight + 2;
            });

            // Bill To Section
            doc.setFontSize(10);
            doc.setTextColor(102, 126, 234);
            doc.setFont('helvetica', 'bold');
            doc.text('Bill To:', 15, 65);

            doc.setFontSize(12);
            doc.setTextColor(50, 50, 50);
            doc.text(billToCompany, 15, 72);

            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.setFont('helvetica', 'normal');
            const billToLines = billToAddress.split('\n');
            billToLines.forEach((line, i) => {
                doc.text(line, 15, 79 + (i * 5));
            });

            // Items Table
            doc.autoTable({
                startY: 100,
                head: [['Material No.', 'Description', 'Qty', 'Unit', 'Price', 'Total']],
                body: tableData,
                theme: 'grid',
                headStyles: {
                    fillColor: [102, 126, 234],
                    textColor: 255,
                    fontStyle: 'bold'
                },
                styles: {
                    fontSize: 10,
                    cellPadding: 5
                },
                columnStyles: {
                    0: { cellWidth: 30 },
                    1: { cellWidth: 'auto' },
                    2: { cellWidth: 20, halign: 'center' },
                    3: { cellWidth: 25, halign: 'center' },
                    4: { cellWidth: 35, halign: 'right' },
                    5: { cellWidth: 35, halign: 'right' }
                }
            });

            // Totals Section
            const finalY = doc.lastAutoTable.finalY + 10;
            const totalsX = 130;
            
            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.setFont('helvetica', 'normal');
            doc.text('Subtotal', totalsX, finalY);
            doc.text(formatCurrencyPlain(subtotal, currency), 195, finalY, { align: 'right' });

            doc.text(`${taxType} (${taxRate}%)`, totalsX, finalY + 7);
            doc.text(formatCurrencyPlain(taxAmount, currency), 195, finalY + 7, { align: 'right' });

            doc.setDrawColor(102, 126, 234);
            doc.setLineWidth(0.5);
            doc.line(totalsX, finalY + 12, 195, finalY + 12);

            doc.setFontSize(12);
            doc.setTextColor(50, 50, 50);
            doc.setFont('helvetica', 'bold');
            doc.text('TOTAL', totalsX, finalY + 20);
            doc.setTextColor(102, 126, 234);
            doc.text(formatCurrencyPlain(total, currency), 195, finalY + 20, { align: 'right' });

            // Bank Details
            const bankY = finalY + 40;
            doc.setFontSize(10);
            doc.setTextColor(102, 126, 234);
            doc.setFont('helvetica', 'bold');
            doc.text('Bank Details', 15, bankY);

            doc.setDrawColor(200, 200, 200);
            doc.setLineWidth(0.3);
            doc.line(15, bankY + 2, 195, bankY + 2);

            doc.setFontSize(9);
            doc.setTextColor(150, 150, 150);
            doc.text('Bank Name', 15, bankY + 12);
            doc.text('Account Number', 80, bankY + 12);
            doc.text('IFSC Code', 145, bankY + 12);

            doc.setTextColor(50, 50, 50);
            doc.setFont('helvetica', 'normal');
            doc.text(bankName, 15, bankY + 19);
            doc.text(accountNumber, 80, bankY + 19);
            doc.text(ifscCode, 145, bankY + 19);

            // Payment Terms
            const termsY = bankY + 35;
            doc.setFontSize(10);
            doc.setTextColor(102, 126, 234);
            doc.setFont('helvetica', 'bold');
            doc.text('Payment Terms', 15, termsY);

            doc.setDrawColor(102, 126, 234);
            doc.setLineWidth(1);
            doc.line(15, termsY + 2, 15, termsY + 18);

            doc.setTextColor(50, 50, 50);
            doc.setFont('helvetica', 'normal');
            doc.text(paymentTerms, 20, termsY + 12);

            // Footer
            doc.setFontSize(9);
            doc.setTextColor(150, 150, 150);
            doc.text('Thank you for your business!', 105, 280, { align: 'center' });

            // Save PDF
            doc.save(`${invoiceNumber}.pdf`);
        }

        // Print invoice
        function printInvoice() {
            window.print();
        }

        // Add event listeners to all form inputs
        document.querySelectorAll('input, select, textarea').forEach(input => {
            input.addEventListener('input', updatePreview);
        });

        // Initialize
        initMaterials();
        updatePreview();
    </script>
</body>
</html>
